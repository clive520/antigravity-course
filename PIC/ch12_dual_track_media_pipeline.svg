<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="trackAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="trackBGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="660" rx="16" fill="url(#bgGrad3)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Badge & Header -->
  <g transform="translate(50, 30)">
    <rect width="260" height="26" rx="6" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1"/>
    <text x="130" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">SIX-STAGE DUAL-TRACK PIPELINE</text>
    <text x="0" y="55" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#f8fafc">無人值守雙軌影音自媒體工廠（NotebookLM + 精準字幕 + CLI）</text>
    <text x="0" y="75" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">單一轟動新聞 ➔ 全景白皮書 ➔ NotebookLM 雙產物 ➔ 語意精準字幕 ➔ 縮圖排版 ➔ FFmpeg 重整 ➔ YouTube 雙上傳</text>
  </g>

  <!-- Step 1: Brain Dossier -->
  <g transform="translate(50, 115)" filter="url(#shadow3)">
    <rect width="900" height="60" rx="10" fill="url(#cardGrad3)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="36" cy="30" r="16" fill="#0284c7" fill-opacity="0.3"/>
    <text x="36" y="35" font-family="'Inter', sans-serif" font-size="16" text-anchor="middle">📝</text>
    <text x="68" y="25" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">階段一：AntiGravity 情資總編劇 ➔ 全景白皮書 (01_notebooklm_source.md)</text>
    <text x="68" y="45" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">自動爬取全網爆款新聞，整理事件時間軸、官方回應、各方爭議與正反交鋒論點，徹底消除幻覺。</text>
  </g>

  <!-- Flow Arrows down -->
  <path d="M 280 175 L 280 205" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="280,210 276,202 284,202" fill="#38bdf8"/>

  <path d="M 720 175 L 720 205" fill="none" stroke="#e879f9" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="720,210 716,202 724,202" fill="#e879f9"/>

  <!-- Left Track: Briefing Video -->
  <g transform="translate(50, 215)" filter="url(#shadow3)">
    <rect width="430" height="320" rx="12" fill="url(#trackAGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="20" y="28" font-family="'Inter', sans-serif" font-size="13.5" font-weight="800" fill="#7dd3fc">🎥 軌道 A：核心事件解說影片 (5~8 分鐘)</text>
    <text x="20" y="46" font-family="'Inter', sans-serif" font-size="10.5" fill="#bae6fd">定位：節奏明快、破百萬大眾推薦流量、快速搞懂真相</text>
    <line x1="20" y1="55" x2="410" y2="55" stroke="#0369a1" stroke-width="1"/>

    <!-- Process A1 -->
    <text x="20" y="75" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">【階段二】NotebookLM CLI 自動提取：</text>
    <text x="36" y="92" font-family="'Inter', sans-serif" font-size="10.5" fill="#cbd5e1">自動觸發簡報導讀影片 ➔ 下載至 raw_briefing.mp4</text>

    <!-- Process A2 (NEW: Subtitle Specialist) -->
    <text x="20" y="118" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">✨【階段三】精準字幕產生員（語意校正）：</text>
    <text x="36" y="135" font-family="'Inter', sans-serif" font-size="10.5" fill="#e0f2fe">單行限長 14~18 字（適配手機） ➔ 產出 briefing.srt</text>

    <!-- Process A3 -->
    <text x="20" y="161" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">【階段四】AI 繪圖 + Pillow 縮圖排版：</text>
    <text x="36" y="178" font-family="'Inter', sans-serif" font-size="10.5" fill="#cbd5e1">壓入黃紅新聞感標題大字 ➔ 產出 thumb_briefing.jpg</text>

    <!-- Process A4 -->
    <text x="20" y="204" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">【階段五】FFmpeg 影音重整與壓字幕：</text>
    <text x="36" y="221" font-family="'Inter', sans-serif" font-size="10.5" fill="#cbd5e1">掛載 briefing.srt 高畫質字幕 ➔ 輸出 final_briefing.mp4</text>

    <!-- Output Box A -->
    <rect x="20" y="245" width="390" height="55" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <text x="30" y="268" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">🚀【階段六】YouTube CLI 自動上傳發布</text>
    <text x="30" y="288" font-family="'JetBrains Mono', monospace" font-size="10" fill="#bae6fd">✔ 回傳影片 1 觀看連結：https://youtu.be/briefing_xxx</text>
  </g>

  <!-- Right Track: Podcast Dialogue -->
  <g transform="translate(520, 215)" filter="url(#shadow3)">
    <rect width="430" height="320" rx="12" fill="url(#trackBGrad)" stroke="#a21caf" stroke-width="1.5"/>
    <text x="20" y="28" font-family="'Inter', sans-serif" font-size="13.5" font-weight="800" fill="#f5d0fe">🎙️ 軌道 B：雙人對談漫談 Podcast (20~30 分鐘)</text>
    <text x="20" y="46" font-family="'Inter', sans-serif" font-size="10.5" fill="#f5d0fe">定位：觀點交鋒、超長停留時長、鐵粉高黏著陪伴</text>
    <line x1="20" y1="55" x2="410" y2="55" stroke="#86198f" stroke-width="1"/>

    <!-- Process B1 -->
    <text x="20" y="75" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">【階段二】NotebookLM CLI 自動提取：</text>
    <text x="36" y="92" font-family="'Inter', sans-serif" font-size="10.5" fill="#cbd5e1">自動觸發 Audio Overview ➔ 下載至 raw_podcast.mp3</text>

    <!-- Process B2 (NEW: Subtitle Specialist) -->
    <text x="20" y="118" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#f0abfc">✨【階段三】精準字幕產生員（語意校正）：</text>
    <text x="36" y="135" font-family="'Inter', sans-serif" font-size="10.5" fill="#fae8ff">去除贅字、標註雙人講者 ➔ 產出 podcast.srt</text>

    <!-- Process B3 -->
    <text x="20" y="161" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">【階段四】AI 繪圖 + 演播室縮圖排版：</text>
    <text x="36" y="178" font-family="'Inter', sans-serif" font-size="10.5" fill="#cbd5e1">雙人引號衝突對抗感 ➔ 產出 thumb_podcast.jpg</text>

    <!-- Process B4 -->
    <text x="20" y="204" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">【階段五】FFmpeg 動態音波影音合成：</text>
    <text x="36" y="221" font-family="'Inter', sans-serif" font-size="10.5" fill="#cbd5e1">音波動畫 + podcast.srt 字幕 ➔ 合成 final_podcast.mp4</text>

    <!-- Output Box B -->
    <rect x="20" y="245" width="390" height="55" rx="8" fill="#4a044e" stroke="#e879f9" stroke-width="1"/>
    <text x="30" y="268" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#f0abfc">🚀【階段六】YouTube CLI 自動上傳發布</text>
    <text x="30" y="288" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f5d0fe">✔ 回傳影片 2 觀看連結：https://youtu.be/podcast_yyy</text>
  </g>

  <!-- Bottom Result Banner -->
  <g transform="translate(50, 555)" filter="url(#shadow3)">
    <rect width="900" height="75" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="40" cy="37" r="18" fill="#fbbf24" fill-opacity="0.2"/>
    <text x="40" y="43" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🏆</text>
    <text x="75" y="30" font-family="'Inter', sans-serif" font-size="13.5" font-weight="800" fill="#f8fafc">六階段無人值守自主閉環：零手動搬運，雙影片全自動發布！</text>
    <text x="75" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">情資大腦 ➔ NotebookLM 提取 ➔ 精準字幕校正 ➔ AI 雙縮圖 ➔ FFmpeg 壓製 ➔ YouTube 雙發布</text>
  </g>
</svg>