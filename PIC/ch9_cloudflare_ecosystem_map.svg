<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#09152a"/>
    </linearGradient>
    <linearGradient id="cfOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6821f"/>
      <stop offset="100%" stop-color="#faad3f"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131e36"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Badge & Header -->
  <g transform="translate(60, 40)">
    <rect width="195" height="30" rx="15" fill="rgba(246, 130, 31, 0.15)" stroke="#f6821f" stroke-width="1.5"/>
    <text x="97.5" y="20" fill="#f6821f" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">CLOUDFLARE ECOSYSTEM</text>
    <text x="215" y="22" fill="#ffffff" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="24" font-weight="800">Cloudflare 全家桶現代雲端軍火庫全貌</text>
    <text x="0" y="52" fill="#94a3b8" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="14">網頁託管、邊緣運算、三大分散式資料庫、免流量費檔案庫與零信任企業門禁</text>
  </g>

  <!-- 5 Pillars Architecture Grid -->
  <g transform="translate(50, 125)">
    
    <!-- Pillar 1: Web Hosting (Pages) -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="170" height="335" rx="12" fill="url(#cardGrad)" stroke="#f6821f" stroke-width="1.8"/>
      <rect width="170" height="36" rx="12" fill="rgba(246, 130, 31, 0.2)"/>
      <rect y="26" width="170" height="10" fill="url(#cardGrad)"/>
      <text x="85" y="23" fill="#f6821f" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">1. 網頁託管</text>
      
      <circle cx="85" cy="70" r="20" fill="rgba(246, 130, 31, 0.15)" stroke="#f6821f" stroke-width="1.2"/>
      <text x="85" y="76" font-size="18" text-anchor="middle">🌐</text>
      
      <text x="85" y="112" fill="#ffffff" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Pages</text>
      <text x="85" y="128" fill="#f6821f" font-family="'Noto Sans TC', sans-serif" font-size="10.5" text-anchor="middle">全球 Anycast CDN</text>
      
      <line x1="14" y1="142" x2="156" y2="142" stroke="#1e293b"/>
      
      <text x="14" y="165" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 330+ 邊緣節點</text>
      <text x="14" y="187" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ Git Push 自動建置</text>
      <text x="14" y="209" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 預覽分支獨立網址</text>
      <text x="14" y="231" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 免費萬用 SSL</text>
      
      <rect x="12" y="255" width="146" height="65" rx="6" fill="#0b1120" stroke="#1e293b"/>
      <text x="85" y="275" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">🎁 免費額度</text>
      <text x="85" y="293" fill="#38bdf8" font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">流量永遠完全無限！</text>
      <text x="85" y="308" fill="#94a3b8" font-family="'Noto Sans TC', sans-serif" font-size="9.5" text-anchor="middle">每月 500 次構建</text>
    </g>

    <!-- Pillar 2: Edge Compute (Workers) -->
    <g transform="translate(182, 0)" filter="url(#shadow)">
      <rect width="170" height="335" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>
      <rect width="170" height="36" rx="12" fill="rgba(56, 189, 248, 0.2)"/>
      <rect y="26" width="170" height="10" fill="url(#cardGrad)"/>
      <text x="85" y="23" fill="#38bdf8" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">2. 邊緣運算</text>
      
      <circle cx="85" cy="70" r="20" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="85" y="76" font-size="18" text-anchor="middle">⚡</text>
      
      <text x="85" y="112" fill="#ffffff" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Workers</text>
      <text x="85" y="128" fill="#38bdf8" font-family="'Noto Sans TC', sans-serif" font-size="10.5" text-anchor="middle">Serverless Edge API</text>
      
      <line x1="14" y1="142" x2="156" y2="142" stroke="#1e293b"/>
      
      <text x="14" y="165" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 冷啟動 &lt; 5ms</text>
      <text x="14" y="187" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 保管 API 密鑰</text>
      <text x="14" y="209" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 中繼請求與過濾</text>
      <text x="14" y="231" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ Cron 排程定時器</text>
      
      <rect x="12" y="255" width="146" height="65" rx="6" fill="#0b1120" stroke="#1e293b"/>
      <text x="85" y="275" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">🎁 免費額度</text>
      <text x="85" y="293" fill="#38bdf8" font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">每天 10 萬次請求</text>
      <text x="85" y="308" fill="#94a3b8" font-family="'Noto Sans TC', sans-serif" font-size="9.5" text-anchor="middle">10ms CPU 執行時間</text>
    </g>

    <!-- Pillar 3: Edge Databases (D1 / KV / Vectorize) -->
    <g transform="translate(364, 0)" filter="url(#shadow)">
      <rect width="185" height="335" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
      <rect width="185" height="36" rx="12" fill="rgba(16, 185, 129, 0.2)"/>
      <rect y="26" width="185" height="10" fill="url(#cardGrad)"/>
      <text x="92.5" y="23" fill="#10b981" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">3. 邊緣三大資料庫</text>
      
      <circle cx="92.5" cy="70" r="20" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2"/>
      <text x="92.5" y="76" font-size="18" text-anchor="middle">🗄️</text>
      
      <text x="92.5" y="112" fill="#ffffff" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">D1 / KV / Vectorize</text>
      <text x="92.5" y="128" fill="#10b981" font-family="'Noto Sans TC', sans-serif" font-size="10.5" text-anchor="middle">SQL + 鍵值 + 向量</text>
      
      <line x1="14" y1="142" x2="171" y2="142" stroke="#1e293b"/>
      
      <text x="14" y="165" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ <strong>D1</strong>: 邊緣關聯 SQLite</text>
      <text x="14" y="187" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ <strong>KV</strong>: 高速讀取快取庫</text>
      <text x="14" y="209" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ <strong>Vectorize</strong>: AI 向量檢索</text>
      <text x="14" y="231" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 毫秒同步各節點</text>
      
      <rect x="12" y="255" width="161" height="65" rx="6" fill="#0b1120" stroke="#1e293b"/>
      <text x="92.5" y="275" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">🎁 免費額度</text>
      <text x="92.5" y="293" fill="#38bdf8" font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">D1: 5GB (日讀500萬列)</text>
      <text x="92.5" y="308" fill="#94a3b8" font-family="'Noto Sans TC', sans-serif" font-size="9.5" text-anchor="middle">Vector: 月 3000 萬維度</text>
    </g>

    <!-- Pillar 4: Object Storage (R2) -->
    <g transform="translate(561, 0)" filter="url(#shadow)">
      <rect width="170" height="335" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.8"/>
      <rect width="170" height="36" rx="12" fill="rgba(245, 158, 11, 0.2)"/>
      <rect y="26" width="170" height="10" fill="url(#cardGrad)"/>
      <text x="85" y="23" fill="#f59e0b" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">4. 檔案資料庫</text>
      
      <circle cx="85" cy="70" r="20" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="85" y="76" font-size="18" text-anchor="middle">📦</text>
      
      <text x="85" y="112" fill="#ffffff" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Cloudflare R2</text>
      <text x="85" y="128" fill="#f59e0b" font-family="'Noto Sans TC', sans-serif" font-size="10.5" text-anchor="middle">S3 相容物件儲存</text>
      
      <line x1="14" y1="142" x2="156" y2="142" stroke="#1e293b"/>
      
      <text x="14" y="165" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 存放 PDF、Word、圖片</text>
      <text x="14" y="187" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 完全相容 S3 API</text>
      <text x="14" y="209" fill="#f59e0b" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="700">▸ 0 元出站流量費！</text>
      <text x="14" y="231" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 永遠不收下載頻寬費</text>
      
      <rect x="12" y="255" width="146" height="65" rx="6" fill="#0b1120" stroke="#1e293b"/>
      <text x="85" y="275" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">🎁 免費額度</text>
      <text x="85" y="293" fill="#38bdf8" font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">每月 10 GB 儲存</text>
      <text x="85" y="308" fill="#94a3b8" font-family="'Noto Sans TC', sans-serif" font-size="9.5" text-anchor="middle">月讀千萬次・下載 0 元</text>
    </g>

    <!-- Pillar 5: Security (Zero Trust Access) -->
    <g transform="translate(743, 0)" filter="url(#shadow)">
      <rect width="157" height="335" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.8"/>
      <rect width="157" height="36" rx="12" fill="rgba(129, 140, 248, 0.2)"/>
      <rect y="26" width="157" height="10" fill="url(#cardGrad)"/>
      <text x="78.5" y="23" fill="#818cf8" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">5. 企業資安門禁</text>
      
      <circle cx="78.5" cy="70" r="20" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="1.2"/>
      <text x="78.5" y="76" font-size="18" text-anchor="middle">🛡️</text>
      
      <text x="78.5" y="112" fill="#ffffff" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Zero Trust</text>
      <text x="78.5" y="128" fill="#818cf8" font-family="'Noto Sans TC', sans-serif" font-size="10.5" text-anchor="middle">Access 員工登入</text>
      
      <line x1="14" y1="142" x2="143" y2="142" stroke="#1e293b"/>
      
      <text x="14" y="165" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 免寫登入程式碼</text>
      <text x="14" y="187" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 限制公司 Email 域</text>
      <text x="14" y="209" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 阻擋外部無關訪客</text>
      <text x="14" y="231" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 支援 Google SSO</text>
      
      <rect x="10" y="255" width="137" height="65" rx="6" fill="#0b1120" stroke="#1e293b"/>
      <text x="78.5" y="275" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">🎁 免費額度</text>
      <text x="78.5" y="293" fill="#38bdf8" font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">前 50 位員工</text>
      <text x="78.5" y="308" fill="#94a3b8" font-family="'Noto Sans TC', sans-serif" font-size="9.5" text-anchor="middle">永久完全免費！</text>
    </g>

  </g>

  <!-- Bottom Tip -->
  <g transform="translate(50, 485)">
    <rect width="900" height="42" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="26" font-size="16">💡</text>
    <text x="50" y="26" fill="#cbd5e1" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="12.5">
      這就是現代全端開發的「邊緣全家桶」：前端放 Pages、運算靠 Workers、大檔放 R2、資料庫有 D1/Vectorize、門禁有 Zero Trust，<strong>全部都能用佛心的免費額度直接跑起來</strong>！
    </text>
  </g>
</svg>
