<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0d1326"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="16" fill="url(#bgGrad)"/>
  <rect width="996" height="616" x="2" y="2" rx="15" fill="none" stroke="rgba(251, 191, 36, 0.25)" stroke-width="1.5"/>

  <!-- Background Subtle Grid -->
  <g opacity="0.08" stroke="#cbd5e1" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="620"/>
    <line x1="200" y1="0" x2="200" y2="620"/>
    <line x1="350" y1="0" x2="350" y2="620"/>
    <line x1="500" y1="0" x2="500" y2="620"/>
    <line x1="650" y1="0" x2="650" y2="620"/>
    <line x1="800" y1="0" x2="800" y2="620"/>
    <line x1="950" y1="0" x2="950" y2="620"/>
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="340" x2="1000" y2="340"/>
    <line x1="0" y1="480" x2="1000" y2="480"/>
  </g>

  <!-- Title Header -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="136" height="24" rx="12" fill="rgba(251, 191, 36, 0.15)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1"/>
    <text x="68" y="16" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CHAPTER 15 PIPELINE</text>
    <text x="0" y="52" fill="#f8fafc" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="800">AntiGravity 長程自主代理人管線圖 (Autonomous Goal Pipeline)</text>
    <text x="0" y="74" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">從人類目標下達 ➔ 夜間自主分解執行 ➔ 批判驗證與快照回溯 ➔ 清晨全綠燈成果交付</text>
  </g>

  <!-- Human Command Card (Top Left) -->
  <g transform="translate(50, 145)" filter="url(#softShadow)">
    <rect width="260" height="150" rx="12" fill="url(#cardGrad)" stroke="rgba(251, 191, 36, 0.5)" stroke-width="1.5"/>
    <circle cx="36" cy="34" r="14" fill="rgba(251, 191, 36, 0.2)"/>
    <text x="36" y="39" font-size="14" text-anchor="middle">🎯</text>
    <text x="60" y="32" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="14" font-weight="700">1. 人類指揮官下達</text>
    <text x="60" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Slash Command: /goal</text>

    <line x1="20" y1="64" x2="240" y2="64" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <text x="24" y="86" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12" font-weight="600">明確定義不可妥協的標準：</text>
    <text x="24" y="106" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• 終極目標與驗收指標 (DoD)</text>
    <text x="24" y="124" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• 最大預算/步數安全上限</text>
    <text x="24" y="142" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="700">▶ 離席關燈，交付 AI 自主接管</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 310 220 L 360 220" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowGold)"/>

  <!-- Milestone Decomposition Card (Center Top) -->
  <g transform="translate(370, 145)" filter="url(#softShadow)">
    <rect width="270" height="150" rx="12" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5"/>
    <circle cx="36" cy="34" r="14" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="36" y="39" font-size="14" text-anchor="middle">🗺️</text>
    <text x="60" y="32" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="14" font-weight="700">2. 目標深度分解</text>
    <text x="60" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Goal Decomposition &amp; Plan</text>

    <line x1="20" y1="64" x2="250" y2="64" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <text x="24" y="86" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">1. 全站狀態靜態探勘 (Audit)</text>
    <text x="24" y="106" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">2. 核心效能與 SEO 重構</text>
    <text x="24" y="126" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">3. a11y 無障礙與超連結修復</text>
    <text x="24" y="144" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">建立 Milestone 階梯路徑圖</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 640 220 L 690 220" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- Autonomous State Machine & Execution Card (Top Right) -->
  <g transform="translate(700, 145)" filter="url(#softShadow)">
    <rect width="250" height="150" rx="12" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.5)" stroke-width="1.5"/>
    <circle cx="36" cy="34" r="14" fill="rgba(192, 132, 252, 0.2)"/>
    <text x="36" y="39" font-size="14" text-anchor="middle">⚙️</text>
    <text x="60" y="32" fill="#c084fc" font-family="'Inter', sans-serif" font-size="14" font-weight="700">3. 狀態機與預算管理</text>
    <text x="60" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">State Machine &amp; Budgeting</text>

    <line x1="20" y1="64" x2="230" y2="64" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <text x="24" y="86" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• 自動調用工具改碼與測試</text>
    <text x="24" y="106" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• 定時自動 /compact 壓縮語境</text>
    <text x="24" y="126" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• 確保 Context 永不溢出斷片</text>
    <text x="24" y="144" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">長時間深度思考運轉</text>
  </g>

  <!-- Flow Arrow Down: 3 -> 4 (Verification & Self-Critique) -->
  <path d="M 825 295 L 825 355" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- Self-Critique & Continuous Verification Card (Center Bottom) -->
  <g transform="translate(520, 360)" filter="url(#softShadow)">
    <rect width="430" height="200" rx="12" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.5"/>
    <circle cx="36" cy="34" r="14" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="36" y="39" font-size="14" text-anchor="middle">🛡️</text>
    <text x="60" y="32" fill="#34d399" font-family="'Inter', sans-serif" font-size="14" font-weight="700">4. 自我批判驗證與安全回滾護城河 (Verification &amp; Backtracking)</text>
    <text x="60" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Self-Critique, Dynamic Testing &amp; Git Rollback</text>

    <line x1="20" y1="64" x2="410" y2="64" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Two sub blocks -->
    <rect x="24" y="78" width="185" height="106" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="36" y="98" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="700">🟢 達標推進 (All Passed)</text>
    <text x="36" y="120" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• Lighthouse 效能 95+ 達標</text>
    <text x="36" y="138" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• WCAG 無障礙全綠燈</text>
    <text x="36" y="156" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• 自動打 Git Commit 快照</text>
    <text x="36" y="174" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="700">解鎖下一個 Milestone</text>

    <rect x="225" y="78" width="185" height="106" rx="8" fill="rgba(244, 63, 94, 0.08)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1"/>
    <text x="237" y="98" fill="#fb7185" font-family="'Inter', sans-serif" font-size="12" font-weight="700">🔴 死路回退 (Backtracking)</text>
    <text x="237" y="120" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• 代碼改壞導致破版</text>
    <text x="237" y="138" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• 自動 git reset 上一快照</text>
    <text x="237" y="156" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• 探索替代重構方案</text>
    <text x="237" y="174" fill="#fb7185" font-family="'Inter', sans-serif" font-size="11" font-weight="700">永不卡死在錯誤死胡同</text>
  </g>

  <!-- Flow Arrow Left: 4 -> 5 (Delivery) -->
  <path d="M 520 460 L 370 460" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowEmerald)"/>

  <!-- Ultimate Delivery Card (Bottom Left) -->
  <g transform="translate(50, 360)" filter="url(#softShadow)">
    <rect width="310" height="200" rx="12" fill="url(#cardGrad)" stroke="rgba(251, 191, 36, 0.6)" stroke-width="2"/>
    <circle cx="36" cy="34" r="14" fill="rgba(251, 191, 36, 0.25)"/>
    <text x="36" y="39" font-size="14" text-anchor="middle">🏆</text>
    <text x="60" y="32" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="14" font-weight="700">5. 終極工程交付物 (Morning Delivery)</text>
    <text x="60" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Audit Log, Pull Request &amp; Dashboard</text>

    <line x1="20" y1="64" x2="290" y2="64" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <text x="24" y="88" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">🌅 人類清晨醒來驗收：</text>
    <text x="24" y="110" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">✓ 前後效能對比雷達圖 (98 vs 71)</text>
    <text x="24" y="130" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">✓ 完整自主重構日誌 (goal-benchmark-report)</text>
    <text x="24" y="150" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">✓ 乾淨且通過所有測試的 Git 分支與 PR</text>
    
    <rect x="24" y="162" width="260" height="26" rx="6" fill="rgba(251, 191, 36, 0.15)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1"/>
    <text x="154" y="179" fill="#fde047" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">🎉 關燈睡覺 ➔ 醒來直接驗收交付！</text>
  </g>
</svg>
