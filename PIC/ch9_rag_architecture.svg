<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#0c1527"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131e36"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Badge & Header -->
  <g transform="translate(60, 45)">
    <rect width="175" height="30" rx="15" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="87.5" y="20" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">RAG ARCHITECTURE</text>
    <text x="195" y="22" fill="#ffffff" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="24" font-weight="800">RAG 檢索增強生成：企業知識庫運作全貌</text>
    <text x="0" y="52" fill="#94a3b8" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="14">告別 AI 胡說八道！「先查資料庫手冊段落，再叫大模型精準總結」的嚴謹工程閉環</text>
  </g>

  <!-- Top Phase: Ingestion (離線資料入庫) -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <rect width="880" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="880" height="32" rx="12" fill="rgba(129, 140, 248, 0.15)"/>
    <rect y="22" width="880" height="10" fill="url(#cardGrad)"/>
    <text x="20" y="21" fill="#818cf8" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700">階段一：離線知識庫建置（手冊切塊與向量化儲存）</text>
    
    <!-- 1. Raw Docs -->
    <g transform="translate(30, 45)">
      <rect width="145" height="85" rx="8" fill="#0b1120" stroke="#1e293b"/>
      <text x="72.5" y="32" font-size="20" text-anchor="middle">📚</text>
      <text x="72.5" y="55" fill="#ffffff" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">4 大企業手冊</text>
      <text x="72.5" y="72" fill="#94a3b8" font-family="'Noto Sans TC', sans-serif" font-size="10.5" text-anchor="middle">差勤/出差/資安/福利</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <g transform="translate(185, 80)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#818cf8" stroke-width="2"/>
      <polygon points="20,-4 26,0 20,4" fill="#818cf8"/>
    </g>

    <!-- 2. Chunking -->
    <g transform="translate(220, 45)">
      <rect width="165" height="85" rx="8" fill="#0b1120" stroke="#818cf8" stroke-width="1.2"/>
      <text x="82.5" y="32" font-size="20" text-anchor="middle">✂️</text>
      <text x="82.5" y="55" fill="#818cf8" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">智慧段落切塊</text>
      <text x="82.5" y="72" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="10.5" text-anchor="middle">400字/塊 + 重疊50字</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <g transform="translate(395, 80)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#818cf8" stroke-width="2"/>
      <polygon points="20,-4 26,0 20,4" fill="#818cf8"/>
    </g>

    <!-- 3. Embedding -->
    <g transform="translate(425, 45)">
      <rect width="195" height="85" rx="8" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="97.5" y="32" font-size="20" text-anchor="middle">🧮</text>
      <text x="97.5" y="55" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Google Embedding-004</text>
      <text x="97.5" y="72" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="10.5" text-anchor="middle">文字 ➔ 768 維語意向量</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <g transform="translate(630, 80)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#34d399" stroke-width="2"/>
      <polygon points="20,-4 26,0 20,4" fill="#34d399"/>
    </g>

    <!-- 4. Supabase DB -->
    <g transform="translate(660, 45)">
      <rect width="190" height="85" rx="8" fill="#061a12" stroke="#10b981" stroke-width="1.5"/>
      <text x="95" y="32" font-size="20" text-anchor="middle">🗄️</text>
      <text x="95" y="55" fill="#10b981" font-family="'Inter', sans-serif" font-size="12.5" font-weight="800" text-anchor="middle">Supabase (pgvector)</text>
      <text x="95" y="72" fill="#34d399" font-family="'Noto Sans TC', sans-serif" font-size="10.5" text-anchor="middle">永久免費 500MB 資料庫</text>
    </g>
  </g>

  <!-- Bottom Phase: Online Q&A (線上即時問答) -->
  <g transform="translate(60, 305)" filter="url(#shadow)">
    <rect width="880" height="175" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.8"/>
    <rect width="880" height="32" rx="12" fill="rgba(16, 185, 129, 0.2)"/>
    <rect y="22" width="880" height="10" fill="url(#cardGrad)"/>
    <text x="20" y="21" fill="#10b981" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="13" font-weight="800">階段二：線上即時問答（提問 ➔ 語意匹配 ➔ LLM 精確總結）</text>

    <!-- Step A: User Query -->
    <g transform="translate(25, 45)">
      <rect width="180" height="110" rx="8" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="20" y="30" font-size="18">🙋</text>
      <text x="45" y="30" fill="#ffffff" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700">新人自然語言提問</text>
      <rect x="15" y="45" width="150" height="30" rx="4" fill="#1e293b"/>
      <text x="22" y="65" fill="#38bdf8" font-family="'Noto Sans TC', sans-serif" font-size="11">「出差高鐵可以報帳嗎？」</text>
      <text x="15" y="96" fill="#94a3b8" font-family="'Noto Sans TC', sans-serif" font-size="10">自動轉為 768 維問題向量</text>
    </g>

    <!-- Arrow A -> B -->
    <g transform="translate(215, 100)">
      <line x1="0" y1="0" x2="22" y2="0" stroke="#38bdf8" stroke-width="2"/>
      <polygon points="22,-4 28,0 22,4" fill="#38bdf8"/>
    </g>

    <!-- Step B: Cosine Similarity -->
    <g transform="translate(250, 45)">
      <rect width="210" height="110" rx="8" fill="#0b1120" stroke="#10b981" stroke-width="1.2"/>
      <text x="20" y="30" font-size="18">🔍</text>
      <text x="45" y="30" fill="#10b981" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700">餘弦相似度向量檢索</text>
      <text x="18" y="55" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="11">▸ 呼叫 match_handbooks()</text>
      <text x="18" y="75" fill="#34d399" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="700">▸ 撈出 Top 3 最吻合手冊段落</text>
      <text x="18" y="96" fill="#94a3b8" font-family="'Noto Sans TC', sans-serif" font-size="10.5">鎖定《出差報銷規範》2.1 條</text>
    </g>

    <!-- Arrow B -> C -->
    <g transform="translate(468, 100)">
      <line x1="0" y1="0" x2="22" y2="0" stroke="#10b981" stroke-width="2"/>
      <polygon points="22,-4 28,0 22,4" fill="#10b981"/>
    </g>

    <!-- Step C: Prompt Assembly -->
    <g transform="translate(498, 45)">
      <rect width="180" height="110" rx="8" fill="#0b1120" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="20" y="30" font-size="18">🧩</text>
      <text x="45" y="30" fill="#f59e0b" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700">提示詞接地組裝</text>
      <text x="16" y="55" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="10.5">系統指令：</text>
      <text x="16" y="73" fill="#f59e0b" font-family="'Noto Sans TC', sans-serif" font-size="10.5">「請依據以下段落回答，</text>
      <text x="16" y="91" fill="#f59e0b" font-family="'Noto Sans TC', sans-serif" font-size="10.5">絕不瞎編，並附出處：」</text>
      <text x="16" y="105" fill="#94a3b8" font-family="'Noto Sans TC', sans-serif" font-size="9.5">+【檢索出的 3 條手冊本文】</text>
    </g>

    <!-- Arrow C -> D -->
    <g transform="translate(686, 100)">
      <line x1="0" y1="0" x2="22" y2="0" stroke="#f59e0b" stroke-width="2"/>
      <polygon points="22,-4 28,0 22,4" fill="#f59e0b"/>
    </g>

    <!-- Step D: Gemini Output -->
    <g transform="translate(716, 45)">
      <rect width="140" height="110" rx="8" fill="#061528" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="30" font-size="18">✨</text>
      <text x="45" y="30" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Gemini 生成</text>
      <text x="14" y="55" fill="#34d399" font-family="'Noto Sans TC', sans-serif" font-size="10.5" font-weight="700">✓ 條列完整解答</text>
      <text x="14" y="73" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="10">✓ 跨縣市滿100公里</text>
      <text x="14" y="90" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="10">✓ 限標準車廂</text>
      <rect x="10" y="96" width="120" height="18" rx="3" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="70" y="109" fill="#38bdf8" font-family="'Noto Sans TC', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">📄 出處：《出差規範》第2章</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(60, 500)">
    <rect width="880" height="38" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="24" font-size="15">💡</text>
    <text x="45" y="24" fill="#cbd5e1" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="12">
      RAG 的核心魅力：<strong>模型不需要重新微調（Fine-tuning）</strong>，只要手冊有修改，只需更新 Supabase 裡對應的幾列資料，AI 幾秒鐘內立刻學會新規則！
    </text>
  </g>
</svg>
